# Keeps the two things CI depends on from silently ageing: the pinned action
# majors (v5/v6 had drifted two majors behind before anyone noticed) and the
# pinned ruff in requirements_test.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Dev-only: ESLint for the card. Nothing here ships to users.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
