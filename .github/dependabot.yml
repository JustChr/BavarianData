# Keeps the two things CI depends on from silently ageing: the pinned action
# majors (v5/v6 had drifted two majors behind before anyone noticed) and the
# pinned ruff in requirements_test.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # increase-if-necessary: only raise a requirement the new version does not
  # already satisfy. That bumps the pinned ruff (a pin forbids the new release)
  # while leaving the floors in requirements_test.txt alone -- widening those
  # was four PRs a month that changed nothing, since a floor resolves to the
  # newest release on a fresh runner anyway.
  - package-ecosystem: pip
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Dev-only: ESLint for the card. Nothing here ships to users.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
