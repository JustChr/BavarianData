name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # ``labeled`` so that adding the "refactor" label starts the golden gate.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.3 -- the floor in hacs.json -- requires Python
          # 3.14.2, so every install this integration runs on is on 3.14 or
          # newer (2026.2 was the last release to accept 3.13). Testing an
          # older minor would only cover a configuration no user has.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - uses: actions/setup-node@v7
        with:
          # The card tests run the shipped JS under Node and skip themselves
          # when it is absent. Pinning the major stops that coverage from
          # appearing and disappearing with the runner image.
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Lint (ruff)
        # Rule selection lives in pyproject.toml: real bug patterns (pyflakes,
        # bugbear, logging).
        run: ruff check custom_components/bavariandata tests tests_ha
      - name: Format (ruff)
        # The generated descriptor_metadata.py is excluded in pyproject.toml;
        # passing directories rather than files is what makes that apply.
        run: ruff format --check custom_components/bavariandata tests tests_ha tools
      - name: Install Node dev dependencies
        # Dev-only: ESLint for the card. Nothing from node_modules ships.
        run: npm ci
      - name: Lint the card (ESLint)
        run: npx eslint custom_components/bavariandata/www
      - name: Run tests
        # Coverage is reported, never gated -- see the note in pyproject.toml
        # for why the total is the wrong number to read.
        run: pytest tests/ -q --cov --cov-report=term:skip-covered

  golden:
    name: Refactoring gate
    # The behaviour gate of scripts/golden.py: the coordinator traced step by
    # step against the base branch's code, twice for determinism, and with a
    # twin car for isolation. It takes ~15 minutes, so it runs on pull requests
    # labelled "refactor" -- the ones that claim to change nothing.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'refactor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Golden gate
        run: python scripts/golden.py gate --base "origin/${{ github.base_ref }}" --keep "$RUNNER_TEMP/golden"

  home-assistant:
    name: Home Assistant tests
    # tests_ha/ against a real Home Assistant (pytest-homeassistant-custom-
    # component), then both suites' coverage combined, per module -- the
    # Quality Scale counts every module on its own (scripts/coverage_modules.py).
    # Two environments: the plugin pins its own pytest, below the main suite's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_test_ha.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Main suite, for coverage
        run: |
          python -m venv /tmp/unit
          /tmp/unit/bin/pip install -q -r requirements_test.txt
          COVERAGE_FILE=.coverage.unit /tmp/unit/bin/python -m pytest tests/ -q --cov --cov-report=
      - name: Home Assistant suite
        run: |
          python -m venv /tmp/ha
          /tmp/ha/bin/pip install -q -r requirements_test_ha.txt
          COVERAGE_FILE=.coverage.ha /tmp/ha/bin/python -m pytest -c tests_ha/pytest.ini tests_ha -q \
            --cov=custom_components/bavariandata --cov-report=
      - name: Coverage per module
        run: |
          /tmp/unit/bin/coverage combine .coverage.unit .coverage.ha
          /tmp/unit/bin/coverage json -q -o coverage.json
          python scripts/coverage_modules.py coverage.json
