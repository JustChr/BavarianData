name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt ruff
      - name: Lint (ruff)
        # Rule selection lives in pyproject.toml: real bug patterns (pyflakes,
        # bugbear, logging) are enforced; cosmetic reflow is left to
        # `ruff format` (not yet gated — see pyproject.toml).
        run: ruff check custom_components/bavariandata tests
      - name: Run tests
        run: pytest tests/ -q
