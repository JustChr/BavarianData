# Ruff configuration for the BavarianData integration.
#
# The lint selection is intentionally wider than "just the fatal errors": it
# catches real bug patterns (pyflakes, flake8-bugbear, flake8-logging) on top of
# syntax/undefined-name checks, while leaving the purely cosmetic rules
# (line-length, import sorting, the pyupgrade rewrites) off so a legacy file does
# not drown the signal. Narrow the net per-file with ``per-file-ignores`` rather
# than shrinking the global ``select``.
[tool.ruff]
# Home Assistant 2026.3 (the floor in hacs.json) requires Python 3.14.2,
# so every install runs 3.14 or newer -- ruff may assume its syntax.
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle: import placement
    "E7",   # pycodestyle: statement/compound-statement errors
    "E9",   # pycodestyle: syntax errors
    "F",    # pyflakes: undefined names, unused imports/vars, f-string bugs
    "W",    # pycodestyle warnings (trailing whitespace, etc.)
    "B",    # flake8-bugbear: likely bugs (mutable defaults, raise-without-from)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie: small correctness/idiom fixes
    "LOG",  # flake8-logging: logging misuse
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over lint purity.
"tests/**" = ["B011"]

[tool.ruff.format]
# Enforced in CI as ``ruff format --check``.
#
# ``descriptor_metadata.py`` is excluded because it is generated: the formatter
# would rewrite its quotes, ``tools/generate_metadata.py`` would write them back
# on the next run, and ``test_generators_are_idempotent`` would fail either way.
# How generated output looks is the generator's business, not the formatter's.
exclude = ["custom_components/bavariandata/descriptor_metadata.py"]
docstring-code-format = false

# Strict typing (the Quality Scale's Platinum ``strict-typing`` rule), checked
# against a real Home Assistant: CI's "Home Assistant tests" job runs ``mypy``
# from this file; locally ``bash scripts/mypy.sh`` does the same in WSL (HA
# cannot be imported on Windows, and without it every HA type is ``Any``).
[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/bavariandata"]

# Home Assistant's packages re-export names without ``__all__`` (HA's own
# components import ``SourceType`` from ``device_tracker`` and so on); strict
# mode's ``no_implicit_reexport`` would make every such import an error.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true

# Home Assistant 2026.10 types its schemas as probatio's (its voluptuous fork:
# services, flows, LLM tools), while the 2026.3 floor takes voluptuous; both
# accept a voluptuous schema at run time. Until the floor moves past the
# switch, voluptuous is read as untyped rather than every schema ignored.
[[tool.mypy.overrides]]
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# Coverage is measured and reported, not gated -- yet.
#
# The number to read is per module, not the total: the Quality Scale's Silver
# ``test-coverage`` rule wants more than 95 % of every module (the goal is Gold).
# The modules that import Home Assistant -- sensor, config_flow, the entity
# platforms, most of __init__ -- cannot run in tests/ (HA cannot even be
# imported on Windows); tests_ha/ runs them against a real Home Assistant on
# Linux, and CI's "Home Assistant tests" job combines the two suites and lists
# every module against the bar (scripts/coverage_modules.py). It turns into a
# gate (--gate) once every module clears it.
[tool.coverage.run]
source = ["custom_components/bavariandata"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
