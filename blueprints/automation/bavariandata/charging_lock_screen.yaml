blueprint:
  name: "BavarianData: Charging on the lock screen"
  description: >
    Shows a running charge on your phone's lock screen, as a Live Activity on
    iPhone or a Live Update on Android: the battery as a bar up to the car's
    target, the charging power, and a countdown to the target that the phone
    runs by itself. When the charge ends it shows what went in, how long it took
    (and what it cost, with a tariff set) and then clears itself.

    Needs the Home Assistant Companion app: on iPhone iOS 17.2 or later and Home
    Assistant 2026.7 or later, on Android 16 or later. The countdown is
    BavarianData's own *time to target*, which is known while charging at home;
    elsewhere the card shows the battery level instead.
  domain: automation
  source_url: https://github.com/JustChr/BavarianData/blob/main/blueprints/automation/bavariandata/charging_lock_screen.yaml
  input:
    phones:
      name: Phones
      description: The phones that show the card (their Home Assistant Companion app).
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    vehicles:
      name: Cars
      description: Only these cars. Leave empty for every car.
      default: []
      selector:
        device:
          multiple: true
          # Cars only: every car has a location and a picture, the
          # account's own device has neither.
          entity:
            - integration: bavariandata
              domain: device_tracker
            - integration: bavariandata
              domain: image
    wallbox_power:
      name: Wallbox power
      description: >
        Optional: your wallbox's charging power sensor. BMW often sends the
        car's charging power late, sometimes not for an hour. While the car is
        at home and this sensor reads above 0, the card shows its power instead.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: power
    interval:
      name: Update every
      description: >
        How often the card is refreshed while charging. The countdown runs on the
        phone in between, so a few minutes is plenty; iPhones limit how many
        updates they show anyway. A change of a tenth or more in the charging
        power refreshes it at once.
      default: 2
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: min
    open_on_tap:
      name: Open on tap
      description: >
        Optional: the dashboard that opens when you tap the card, such as
        /dashboard-car. Copy it from your browser's address bar while the
        dashboard is open; the part from the first / after the address is
        enough. Empty opens Home Assistant's start page.
      default: ""
      selector:
        text:
    keep_minutes:
      name: Keep the result for
      description: How long the finished card stays before it clears itself. 0 clears it at once.
      default: 10
      selector:
        number:
          min: 0
          max: 120
          step: 5
          unit_of_measurement: min

mode: parallel
max: 10

triggers:
  - trigger: event
    event_type: bavariandata_charging_started
    id: start
  # Picks a charge back up after a restart, which ends every running card.
  - trigger: homeassistant
    event: start
    id: resume
  # What the resume branch fires once per car still charging, so each car gets
  # a run of its own (as it would from `charging_started`).
  - trigger: event
    event_type: bavariandata_lock_screen_resume
    id: resumed
  # The result gets a run of its own: the run keeping the card current can be
  # busy sending an update at that moment and would miss the event.
  - trigger: event
    event_type: bavariandata_charging_stopped
    id: stopped

variables:
  phones: !input phones
  # Each phone's notification action: the Companion app names it after the
  # device's own name (not one given in Home Assistant).
  notify_actions: >-
    {{ (phones if phones is list else [phones]) | select
       | map('device_attr', 'name') | map('slugify')
       | map('regex_replace', '^', 'notify.mobile_app_') | list }}
  vehicles: !input vehicles
  wallbox_power: !input wallbox_power
  interval: !input interval
  open_on_tap: !input open_on_tap
  keep_minutes: !input keep_minutes
  # Where a tap on the card goes: the picked dashboard, or the start page. A
  # whole address pasted from the browser is cut to its path, which the app
  # opens inside itself.
  tap_url: >-
    {%- set path = (open_on_tap or '') | trim | regex_replace('^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]*', '') -%}
    {{ '/' ~ (path | regex_replace('^/+', '')) }}
  # Joins a number to its unit, so the phone never breaks "15.9 kWh" across lines.
  nbsp: "\u00A0"
  # The pause sign as text, in the card's own color: on its own an iPhone
  # draws it as a blue emoji.
  pause: "\u23F8\uFE0E"
  # Every BavarianData car, or the picked ones, as {vin: device_id}: each car's
  # device carries its VIN as its identifier.
  cars: >-
    {%- set picked = vehicles if vehicles is list else [vehicles] -%}
    {%- set devices = (picked | select | list) or
          (integration_entities('bavariandata') | map('device_id') | select | unique | list) -%}
    {%- set ns = namespace(cars={}) -%}
    {%- for device in devices -%}
      {%- for pair in device_attr(device, 'identifiers') or [] -%}
        {%- if pair[0] == 'bavariandata' -%}
          {%- set ns.cars = dict(ns.cars.items() | list + [(pair[1], device)]) -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{ ns.cars }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: resume
        sequence:
          - variables:
              restarted: "{{ now().isoformat() }}"
          # Let the integration restore its sessions and the stream reconnect.
          - delay:
              minutes: 1
          - repeat:
              for_each: "{{ cars | list }}"
              sequence:
                # Still charging, and since before the restart: a charge that
                # began after it (its energy counter reset later) has a run from
                # its own start already.
                - if:
                    - condition: template
                      value_template: >-
                        {%- set entities = device_entities(cars[repeat.item]) -%}
                        {%- set counter = entities | select('is_state_attr', 'descriptor', 'charged_energy_session') | list | first | default('') -%}
                        {%- set reset = state_attr(counter, 'last_reset') if counter else none -%}
                        {%- set began = as_datetime(reset, none) if reset else none -%}
                        {{ entities
                           | select('is_state_attr', 'descriptor', 'vehicle.drivetrain.electricEngine.charging.status')
                           | select('is_state', ['chargingactive', 'initialization', 'chargingpaused'])
                           | list | count > 0
                           and not (began and began > as_datetime(restarted)) }}
                  then:
                    - event: bavariandata_lock_screen_resume
                      event_data:
                        vin: "{{ repeat.item }}"
      - conditions:
          - condition: trigger
            id: stopped
          - condition: template
            value_template: "{{ trigger.event.data.vin in cars }}"
        sequence:
          - variables:
              device: "{{ cars[trigger.event.data.vin] }}"
              entities: "{{ device_entities(device) }}"
              car: "{{ device_attr(device, 'name_by_user') or device_attr(device, 'name') or 'Car' }}"
              tag: "bavariandata-charging-{{ device }}"
              done: "{{ trigger.event.data }}"
              cost: "{{ done.cost if done.cost is mapping else {} }}"
              # The event's SoC can come as 80.0; the card shows whole percent.
              end_soc: "{{ (done.soc if done.soc is number else 0) | round(0) | int }}"
              target: "{{ (done.target_soc if done.target_soc is number else 100) | round(0) | int }}"
              # The charge's own length: its energy counter was reset when it
              # started, and keeps that time across restarts.
              minutes: >-
                {%- set counter = entities | select('is_state_attr', 'descriptor', 'charged_energy_session') | list | first | default('') -%}
                {%- set reset = state_attr(counter, 'last_reset') if counter else none -%}
                {%- set began = as_datetime(reset, none) if reset else none -%}
                {%- set length = ((now() - began).total_seconds() / 60) | round(0) | int if began else 0 -%}
                {{ length if 0 < length < 1440 else 0 }}
          - repeat:
              for_each: "{{ notify_actions }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ car }}"
                    # ✓ reached the target; short of it, the target it missed.
                    message: >-
                      {{ ('✓' ~ nbsp ~ end_soc ~ nbsp ~ '%') if done.complete
                         else (end_soc ~ nbsp ~ '%' ~ nbsp ~ '/' ~ nbsp ~ target ~ nbsp ~ '%') }}
                      {%- if done.energy_kwh is number %} · +{{ done.energy_kwh | round(1) }}{{ nbsp }}kWh{% endif %}
                      {%- if cost.amount is number %} · {{ '%.2f' | format(cost.amount) }}{{ nbsp ~ cost.currency if cost.currency }}{% endif %}
                      {%- if minutes > 0 %} · {{ (minutes ~ nbsp ~ 'min') if minutes < 60
                           else ((minutes // 60) ~ nbsp ~ 'h' ~ (nbsp ~ (minutes % 60) ~ nbsp ~ 'min' if minutes % 60)) }}{% endif %}
                    data:
                      tag: "{{ tag }}"
                      live_update: true
                      progress: "{{ target if done.complete else [end_soc, target] | min }}"
                      progress_max: "{{ target }}"
                      critical_text: "{{ end_soc }}{{ nbsp }}%"
                      chronometer: false
                      notification_icon: mdi:battery-check
                      notification_icon_color: "#4CAF50"
                      color: "#4CAF50"
                      progress_bar_direction: increasing
                      url: "{{ tap_url }}"
                      clickAction: "{{ tap_url }}"
                      alert_once: true
          - delay:
              minutes: "{{ keep_minutes }}"
          - repeat:
              for_each: "{{ notify_actions }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
    default:
      - condition: template
        value_template: "{{ trigger.event.data.vin in cars }}"
      - variables:
          vin: "{{ trigger.event.data.vin }}"
          device: "{{ cars[vin] }}"
          entities: "{{ device_entities(device) }}"
          car: >-
            {{ trigger.event.data.vehicle
               or device_attr(device, 'name_by_user') or device_attr(device, 'name') or 'Car' }}
          tag: "bavariandata-charging-{{ device }}"
          # Where the charge started: the level to show until there is a newer one.
          start_soc: >-
            {%- set own = entities | select('is_state_attr', 'descriptor', 'soc_estimate')
                  | map('states') | select('is_number') | first -%}
            {%- set bmw = entities | select('is_state_attr', 'descriptor', 'vehicle.drivetrain.batteryManagement.header')
                  | map('states') | select('is_number') | first -%}
            {{ (trigger.event.data.soc if trigger.event.data.soc is number else (own or bmw or 0)) | float(0) | round(0) | int }}
          status: >-
            {{ entities | select('is_state_attr', 'descriptor', 'vehicle.drivetrain.electricEngine.charging.status')
               | list | first | default('') }}
          bmw_power: >-
            {{ entities | select('is_state_attr', 'descriptor', 'vehicle.powertrain.electric.battery.charging.power')
               | list | first | default('') }}
          tracker: "{{ entities | select('match', 'device_tracker[.]') | list | first | default('') }}"
          started: "{{ now().timestamp() }}"
      - repeat:
          sequence:
            # The charge ended while this run was busy: the result's own run
            # shows it, so stop here rather than cover it with an update. That is
            # the car's own end, or a stop that outlasted the five minutes the
            # integration waits for a car to carry on. Not on the first pass: the
            # start event comes a moment before the status says so, and still
            # reads the last charge's end.
            - if:
                - condition: template
                  value_template: >-
                    {{ repeat.index > 1 and status != ''
                       and (is_state(status, 'chargingended')
                            or (not is_state(status, ['chargingactive', 'initialization'])
                                and now() - states[status].last_changed > timedelta(minutes=6))) }}
              then:
                - stop: The charge ended
            - variables:
                # Stopped short of the target, the car may still carry on: the card
                # waits for that or for the result, without a countdown.
                active: >-
                  {{ repeat.index == 1 or status == ''
                     or is_state(status, ['chargingactive', 'initialization']) }}
                # The integration's estimate first: it moves between BMW's updates.
                soc: >-
                  {%- set own = entities | select('is_state_attr', 'descriptor', 'soc_estimate')
                        | map('states') | select('is_number') | first -%}
                  {%- set bmw = entities | select('is_state_attr', 'descriptor', 'vehicle.drivetrain.batteryManagement.header')
                        | map('states') | select('is_number') | first -%}
                  {{ (own or bmw or start_soc) | float(0) | round(0) | int }}
                target: >-
                  {%- set streamed = entities | select('is_state_attr', 'descriptor', 'vehicle.powertrain.electric.battery.stateOfCharge.target')
                        | map('states') | select('is_number') | first -%}
                  {{ (streamed or trigger.event.data.target_soc or 100) | float(100) | round(0) | int }}
                # The wallbox, when picked and charging this car at home: BMW's own
                # value can be an hour old.
                power_entity: >-
                  {{ wallbox_power if wallbox_power and is_state(tracker, 'home')
                     and states(wallbox_power) | float(0) > 0 else bmw_power }}
                # Cars and wallboxes send watts or kilowatts; the card always says kW.
                power_kw: >-
                  {%- if power_entity and states(power_entity) | is_number -%}
                    {%- set unit = state_attr(power_entity, 'unit_of_measurement') -%}
                    {{ [(states(power_entity) | float / (1000 if unit == 'W' else 1)) | round(1), 0] | max }}
                  {%- else -%}
                    0
                  {%- endif -%}
                power: "{{ (power_kw ~ nbsp ~ 'kW') if active and power_kw > 0 else '' }}"
                eta: >-
                  {{ entities | select('is_state_attr', 'descriptor', 'charge_eta')
                     | map('states') | select('is_number') | map('int') | first | default(none) }}
                # The start comes a moment before the energy counter resets: one
                # reset well before this run began is still the last charge's.
                energy: >-
                  {%- set counter = entities | select('is_state_attr', 'descriptor', 'charged_energy_session') | list | first | default('') -%}
                  {%- set reset = state_attr(counter, 'last_reset') if counter else none -%}
                  {%- set stale = trigger.id == 'start' and reset and as_timestamp(reset, 0) < started - 60 -%}
                  {{ states(counter) | float(0) if counter and not stale else 0 }}
            - repeat:
                for_each: "{{ notify_actions }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    data:
                      # The car alone: the icon says charging, and a longer title is
                      # cut off next to the power in the corner.
                      title: "{{ car }}"
                      # Only seen without a countdown, which takes this line on an
                      # iPhone: what the corner doesn't say. Symbols, not words, since
                      # a blueprint can't be translated.
                      message: >-
                        {{ (pause ~ nbsp) if not active }}→{{ nbsp }}{{ target }}{{ nbsp }}%
                        {%- if energy | round(1) > 0 %} · +{{ energy | round(1) }}{{ nbsp }}kWh{% endif %}
                      data:
                        tag: "{{ tag }}"
                        live_update: true
                        # The battery up to the target, so a charge never starts on an
                        # empty bar.
                        progress: "{{ [soc, target] | min }}"
                        progress_max: "{{ target }}"
                        # The top-right corner (Android: the status chip). The countdown
                        # takes the message line, so the target goes here too, until
                        # it is reached.
                        critical_text: >-
                          {{ soc }}{{ (nbsp ~ '→' ~ nbsp ~ target) if soc < target }}{{ nbsp }}%{{ ' · ' ~ power if power }}
                        chronometer: "{{ active and eta is number and eta > 0 }}"
                        when: "{{ (eta * 60) if eta is number else 0 }}"
                        when_relative: true
                        notification_icon: mdi:car-electric
                        notification_icon_color: "#4CAF50"
                        color: "#4CAF50"
                        progress_bar_direction: increasing
                        url: "{{ tap_url }}"
                        clickAction: "{{ tap_url }}"
                        silent: true
                        alert_once: true
            - wait_for_trigger:
                - trigger: event
                  event_type: bavariandata_charging_stopped
                  event_data:
                    vin: "{{ vin }}"
                  id: stopped
                # The car stopped or carried on: say so now, not at the next round.
                - trigger: template
                  id: status
                  value_template: >-
                    {{ status != '' and active != is_state(status, ['chargingactive', 'initialization']) }}
                # The power moved a tenth or more from what the card shows: refresh now.
                - trigger: template
                  id: power
                  value_template: >-
                    {%- set source = wallbox_power if wallbox_power and is_state(tracker, 'home')
                          and states(wallbox_power) | float(0) > 0 else bmw_power -%}
                    {%- set unit = state_attr(source, 'unit_of_measurement') -%}
                    {%- set kw = [(states(source) | float / (1000 if unit == 'W' else 1)) | round(1), 0] | max
                          if states(source) | is_number else 0 -%}
                    {{ (kw - power_kw) | abs >= [power_kw * 0.1, 0.1] | max }}
              timeout:
                minutes: "{{ interval }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none and wait.trigger.id == 'stopped' }}"
              then:
                - stop: The charge ended
            # Power falls as a charge ends, a moment before the car says so: give
            # it that moment, so the check above sees the end.
            - if:
                - condition: template
                  value_template: "{{ wait.trigger is not none and wait.trigger.id == 'power' }}"
              then:
                - delay:
                    seconds: 3
          # A charge that never reports its end (a lost event) stops after a day.
          until: "{{ now().timestamp() - started >= 86400 }}"
