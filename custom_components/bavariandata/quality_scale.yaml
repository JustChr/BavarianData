rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      Cloud push: the cars' data arrives on BMW's MQTT stream. REST is read
      once a day and when the user asks (50 requests a day per account), never
      on a timer of HA's.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: done
    comment: |
      A network or stream failure raises ConfigEntryNotReady. A token refresh
      BMW rejects at start does not fail the setup: BMW's device auth is flaky
      and rejects valid logins now and then, so the stored token is tried and
      ReauthGate starts a reauth flow only once BMW refuses the stream login.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      A car's entities are unavailable while BMW refuses the login. A stream
      drop or a parked car keeps the last report: the car sends only what
      changed, so its last value is still its state.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A BMW account in the cloud; nothing on the network to discover.
  discovery:
    status: exempt
    comment: A BMW account in the cloud; nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: |
      A car that leaves the account is deleted from its device page, taking
      its stored data along. Not automatic: a car that stops reporting is
      more often parked than gone.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      The stream is MQTT over paho-mqtt, the client Home Assistant's own MQTT
      integration uses (core pins it); paho runs its own network thread and
      stream.py hands every callback to the event loop. An asyncio client
      would be a second MQTT stack beside core's for no gain to the user.
  inject-websession: done
  strict-typing:
    status: done
    comment: |
      mypy --strict against the tests' Home Assistant, in CI's Home Assistant
      job (pyproject.toml's [tool.mypy]; locally scripts/mypy.sh).
