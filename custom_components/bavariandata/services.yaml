activate_stream_fields:
  fields:
    entry_id:
      selector:
        text:
    base_url:
      example: https://www.bmw.at
      required: true
      selector:
        text:
    locale:
      example: de-at
      required: true
      selector:
        text:
    mapped_vehicle_id:
      example: 0123456789abcdef…
      required: true
      selector:
        text:
    cookie:
      example: "gcdmToken=…; mybmwUserLogin=…; ak_bmsc=…"
      required: true
      selector:
        text:
          multiline: true
    attributes:
      example: '["vehicle.isMoving", "vehicle.electricalSystem.battery.voltage"]'
      selector:
        object:
    sections:
      example: '["electric", "status"]'
      selector:
        object:
