        text:
    vin:
      example: WBAEXAMPLE0000000
      selector:
        text:
    month:
      example: "2026-07"
      selector:
        text:
    type:
      default: both
      example: both
      selector:
        select:
          options:
            - charging
            - trips
            - both
    format:
      default: csv
      example: csv
      selector:
        select:
          options:
            - csv
            - html
    language:
