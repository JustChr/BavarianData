# Service *schemas* only. Every user-facing name and description lives in
# translations/en.json and translations/de.json under the "services" block, so
# German installs get translated service names in the UI like everything else.
# Examples must stay obviously synthetic -- never paste a real VIN, config entry
# id or portal identifier in here; they are rendered to every user.

